<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XII TKJ 1 - SMK PAB 8 Sampali</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--bg-panel:#151515;--line:rgba(255,255,255,0.1);--text:#f2f2f2;--gold:#ffffff;--gold-soft:rgba(255,255,255,0.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
h1,h2{font-family:'Playfair Display',serif}

/* ORB BACKGROUND */
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
.orb1{width:420px;height:420px;background:radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%);top:-140px;left:-100px}

/* LOCK SCREEN */
#lockScreen{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 55%), var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:999}
#lockScreen.hide{opacity:0;visibility:hidden;pointer-events:none;transition:0.5s}
.lock-card{width:100%;max-width:320px;text-align:center}
.lock-card .school{color:var(--gold);font-size:0.75rem;letter-spacing:0.06em}
.lock-card h1{font-size:1.5rem;margin:10px 0}
.lock-input{width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:10px;font-size:1.3rem;letter-spacing:0.4em;text-align:center}
.lock-btn{width:100%;margin-top:16px;background:var(--gold);color:var(--bg);border:none;padding:13px;border-radius:10px;font-weight:600;cursor:pointer}
.lock-error{color:#e0685f;font-size:0.8rem;margin-top:10px;min-height:1.2em}

/* MAIN CONTENT */
#mainContent{display:none;position:relative;z-index:2}
.wrap{max-width:780px;margin:0 auto;padding:0 22px}
header.hero{padding:96px 0 74px;text-align:center}
header.hero h1{font-size:2.6rem;background:linear-gradient(100deg, #ffffff 20%, #9a9a9a 45%, #ffffff 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
header.hero p{color:#9a9a9a}
section{padding:60px 0;border-bottom:1px solid var(--line)}
.profil-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stat-box{background:rgba(255,255,255,0.035);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat-box .num{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold)}
</style>
</head>
<body>
<div class="orb orb1"></div>

<div id="lockScreen">
  <div class="lock-card">
    <p class="school">SMK PAB 8 SAMPALI</p>
    <h1>XII TKJ 1</h1>
    <p style="color:#9a9a9a;margin-bottom:20px">Masukkan PIN untuk masuk</p>
    <input type="password" id="pin" class="lock-input" placeholder="••••••" maxlength="6">
    <button class="lock-btn" onclick="cekPin()">Buka Website</button>
    <p id="error" class="lock-error"></p>
  </div>
</div>

<div id="mainContent">
  <div class="wrap">
    <header class="hero">
      <h1>XII TKJ 1</h1>
      <p>Teknik Komputer & Jaringan 1 - SMK PAB 8 Sampali</p>
    </header>
    
    <section>
      <h2>Profil Kelas</h2>
      <div class="profil-grid">
        <div class="stat-box"><div class="num">32</div><div class="label">Jumlah Siswa</div></div>
        <div class="stat-box"><div class="num">2025</div><div class="label">Angkatan</div></div>
      </div>
    </section>
  </div>
</div>

<script>
function cekPin(){
  const pin = document.getElementById('pin').value;
  const error = document.getElementById('error');
  if(pin === '121212'){
    document.getElementById('lockScreen').classList.add('hide');
    document.getElementById('mainContent').style.display = 'block';
  } else {
    error.innerText = 'PIN Salah! Coba 121212';
    document.getElementById('pin').value = '';
  }
}
</script>
</body>
</html>
